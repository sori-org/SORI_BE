name: Deploy to EC2

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH vars
        run: |
          echo "Connecting to ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          echo "${{ secrets.EC2_KEY }}" | head -n 5
          
      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_HOST }} "
            cd ~/SORI_BE &&
            git pull origin main &&
            docker-compose down &&
            docker-compose up -d --build
          "
